version: '3.8'
services:
  auth_service:
    build: ./auth_service
    ports:
      - '5001:5001'
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  orders_service:
    build: ./orders_service
    ports:
      - '5002:5002'
    restart: always
    depends_on:
      auth_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:latest
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      auth_service:
        condition: service_healthy
      orders_service:
        condition: service_healthy
    restart: always
